<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>망상그곳</title>
  <link rel="stylesheet" href="./style.css?v=20260728-watch-interval-restore">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>망상그곳</h1>
      <p>망상오토캠핑리조트 빈자리 확인</p>
    </div>
    <div class="top-status">
      <strong id="watchState" class="state-pill">감시 확인 중</strong>
    </div>
  </header>

  <main>
    <section class="summary-grid" aria-label="감시 요약">
      <div><span>현재시간</span><strong id="nowTime">-</strong></div>
      <div><span>취소진행</span><strong id="cancelCount">0건</strong></div>
      <div><span>예약가능</span><strong id="availableCount">0건</strong></div>
      <div><span>갱신시간</span><strong id="lastUpdate">-</strong></div>
    </section>

    <section class="filter-panel">
      <div>
        <span>감시시설(<em id="watchRange">-</em>)</span>
        <strong id="facilityText">든바다, 난바다, 허허바다, 자동차캠핑장</strong>
      </div>
      <div class="facility-filter" id="facilityFilter" aria-label="시설 선택"></div>
    </section>

    <section class="panel cancel-panel">
      <div class="panel-head">
        <h2>현재 취소진행중</h2>
        <span id="cancelBadge">0건</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>날짜</th><th>시설</th><th>객실</th><th>감지</th><th>예상</th><th>남은시간</th></tr></thead>
          <tbody id="cancelBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel history-panel">
      <div class="panel-head">
        <h2>최근 이력</h2>
        <span id="historyBadge">0건</span>
      </div>
      <div class="table-wrap history-scroll">
        <table>
          <thead><tr><th>시간</th><th>종류</th><th>상태</th><th>날짜</th><th>시설</th><th>객실</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel available-panel">
      <div class="panel-head">
        <h2>현재 예약가능</h2>
        <span id="availableBadge">0건</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>날짜</th><th>시설</th><th>객실</th><th>상태</th></tr></thead>
          <tbody id="availableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260728-time-seconds-range"></script>
</body>
</html>
